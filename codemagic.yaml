workflows:
  fitpakistan-android:
    name: FitPakistan Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android: latest
    scripts:
      - name: Build debug APK
        script: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f ./gradlew.bat ]; then
            gradle assembleDebug
          else
            gradle assembleDebug
          fi
    artifacts:
      - app/build/outputs/apk/debug/*.apk
